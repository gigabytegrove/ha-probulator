name: Feature request
description: Suggest a focused HA Probulator improvement
title: "[Feature] "
labels:
  - "enhancement"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What monitoring or Home Assistant workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: native
    attributes:
      label: Home Assistant integration
      description: Explain how the feature should remain usable through normal HA entities, automations, or cards.
