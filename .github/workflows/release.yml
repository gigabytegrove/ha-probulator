name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify release version
        run: |
          python - <<'PY'
          import json
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          with open("custom_components/ha_probulator/manifest.json", encoding="utf-8") as handle:
              actual = json.load(handle)["version"]
          if actual != expected:
              raise SystemExit(f"Tag {tag} does not match manifest version {actual}")
          PY

      - name: Run release checks
        run: |
          python -m compileall -q custom_components/ha_probulator tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m json.tool custom_components/ha_probulator/manifest.json >/dev/null
          python -m json.tool custom_components/ha_probulator/strings.json >/dev/null
          python -m json.tool custom_components/ha_probulator/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          node --check custom_components/ha_probulator/frontend/ha-probulator-cards.js

      - name: Build deterministic release archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import zipfile

          tag = os.environ["GITHUB_REF_NAME"]
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          output = dist / f"ha-probulator-{tag}.zip"
          roots = [
              Path("custom_components/ha_probulator"),
              Path("README.md"),
              Path("LICENSE"),
              Path("hacs.json"),
          ]
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root in roots:
                  if root.is_file():
                      info = zipfile.ZipInfo(root.as_posix(), (2020, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      archive.writestr(info, root.read_bytes())
                      continue
                  for path in sorted(p for p in root.rglob("*") if p.is_file()):
                      info = zipfile.ZipInfo(path.as_posix(), (2020, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      archive.writestr(info, path.read_bytes())
          PY
          cd dist
          sha256sum ha-probulator-*.zip > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             dist/ha-probulator-"$GITHUB_REF_NAME".zip             dist/SHA256SUMS             --verify-tag             --generate-notes             --title "HA Probulator $GITHUB_REF_NAME"
