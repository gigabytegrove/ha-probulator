name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python + frontend + Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q custom_components/ha_probulator tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/ha_probulator/manifest.json >/dev/null
          python -m json.tool custom_components/ha_probulator/strings.json >/dev/null
          python -m json.tool custom_components/ha_probulator/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Check dashboard JavaScript
        run: node --check custom_components/ha_probulator/frontend/ha-probulator-cards.js
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
