name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python + frontend + Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - name: Lint Python
        run: ruff check custom_components/ha_probulator tests
      - name: Check Python formatting
        run: ruff format --check custom_components/ha_probulator tests
      - name: Compile Python
        run: python -m compileall -q custom_components/ha_probulator tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/ha_probulator/manifest.json >/dev/null
          python -m json.tool custom_components/ha_probulator/strings.json >/dev/null
          python -m json.tool custom_components/ha_probulator/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Check dashboard JavaScript
        run: node --check custom_components/ha_probulator/frontend/ha-probulator-cards.js
      - name: Smoke-test dashboard bundle
        run: node tests/frontend_smoke.mjs
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  hacs:
    name: HACS validation
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
