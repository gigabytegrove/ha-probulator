probe:
  name: Probe targets
  description: Immediately probe one target, one group, or every HA Probulator target.
  fields:
    target_id:
      name: Target ID
      description: Stable HA Probulator target ID. Leave blank to use a group or all targets.
      example: "0123456789abcdef0123456789abcdef"
      selector:
        text:
    group:
      name: Group
      description: Probe all targets in this group. Leave both fields blank to probe everything.
      example: "Core Network"
      selector:
        text:

set_monitoring:
  name: Set monitoring
  description: Enable or disable active probing without deleting targets.
  fields:
    target_id:
      name: Target ID
      selector:
        text:
    group:
      name: Group
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

start_maintenance:
  name: Start maintenance
  description: Suppress operational status transitions while continuing to collect probe data.
  fields:
    target_id:
      name: Target ID
      selector:
        text:
    group:
      name: Group
      selector:
        text:
    duration_minutes:
      name: Duration
      description: Minutes before maintenance ends automatically. Zero means indefinite.
      default: 0
      selector:
        number:
          min: 0
          max: 10080
          step: 1
          unit_of_measurement: min
          mode: box

end_maintenance:
  name: End maintenance
  description: End maintenance for one target, one group, or all targets.
  fields:
    target_id:
      name: Target ID
      selector:
        text:
    group:
      name: Group
      selector:
        text:

clone_target:
  name: Clone target
  description: Create a new target using another HA Probulator target's monitoring settings.
  fields:
    source_target_id:
      name: Source target ID
      required: true
      description: Stable HA Probulator target ID to copy settings from.
      selector:
        text:
    name:
      name: New target name
      required: true
      selector:
        text:
    host:
      name: New host or IP address
      required: true
      selector:
        text:
    port:
      name: New TCP port
      description: Leave blank to reuse the source target's port.
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box

export_config:
  name: Export configuration
  description: Return a portable HA Probulator configuration bundle and formatted JSON.
  response:
    optional: false

import_config:
  name: Import configuration
  description: Import targets from a portable HA Probulator export bundle using normal config-flow validation.
  fields:
    payload:
      name: Import payload
      required: true
      description: JSON text or a parsed HA Probulator export object.
      selector:
        object:
  response:
    optional: false

suggest_targets:
  name: Suggest targets
  description: Return possible monitoring targets from host/IP attributes Home Assistant already knows. This performs no subnet or port scan.
  response:
    optional: false
